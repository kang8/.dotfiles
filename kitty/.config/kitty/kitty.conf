# vim:ft=kitty

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

font_size 12
font_family family=Mono
bold_font auto
italic_font auto
bold_italic_font auto
copy_on_select yes
focus_follows_mouse yes
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large
macos_option_as_alt yes
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
scrollback_lines -1
allow_remote_control socket-only
listen_on unix:/tmp/mykitty
scrollbar_width 0.8

# layouts
enabled_layouts tall,fat,stack
map cmd+a toggle_layout stack

# `--cwd=current` takes the highest-PID process in the foreground group, so
# Claude Code's long-lived `aspell` child (cwd=$HOME) hijacks it; `oldest`
# takes the group leader. At a shell prompt both use the OSC 7 cwd.
map cmd+enter launch --type=window --cwd=oldest

# launchd gives kitty a bare PATH and none of zsh's exports, and everything
# `launch` starts inherits that. read_from_shell runs `zsh -l -i` once at
# startup and copies these out of it, so the brew prefix stays out of this file
# (/usr/local on Intel, /opt/homebrew on Apple Silicon). It gives up after
# ~1.5s, and a slow zsh does hit that, hence the PATH line below as a fallback:
# read_from_shell overrides it whenever it succeeds. The plain PATH line applies
# to children launched after a config reload; read_from_shell needs a restart.
env read_from_shell=PATH LANG LC_* EDITOR VISUAL
env PATH=${PATH}:${HOME}/.local/share/bob/nvim-bin:/usr/local/bin:/opt/homebrew/bin
env FZF_DEFAULT_OPTS=--color=light --style=minimal

# Search in kitty using fzf
map cmd+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i

# Pick one of the recent command outputs with fzf, copy it to the clipboard
map cmd+shift+o kitten recent_outputs.py 15

# use `kitty +kitten show_key` show key
# fzf_rg
map ctrl+shift+f send_text all \x1b[102;6u
# fzf_man
map ctrl+shift+m send_text all \x1b[109;6u

map ctrl+shift+l next_layout
map ctrl+shift+h last_used_layout

# window manage
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+h neighboring_window left
map alt+l neighboring_window right

map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+l

map ctrl+alt+j kitten relative_resize.py down  3
map ctrl+alt+k kitten relative_resize.py up    3
map ctrl+alt+h kitten relative_resize.py left  3
map ctrl+alt+l kitten relative_resize.py right 3

map --when-focus-on var:IS_NVIM ctrl+alt+j
map --when-focus-on var:IS_NVIM ctrl+alt+k
map --when-focus-on var:IS_NVIM ctrl+alt+h
map --when-focus-on var:IS_NVIM ctrl+alt+l

# kitty screen grabber
map ctrl+shift+k kitten kitty_grab/grab.py

# Unmap
#  Use in neovim for display document symbols
map ctrl+shift+r no_op
map cmd+w no_op
map ctrl+shift+j no_op
# Use <C-_> for Claude Code undo
map ctrl+shift+- no_op

# Use <cmd+alt+k> for send cc status in Neovim
map cmd+alt+k send_text all \x1b[107;11u
# map cmd+alt+k no_op

cursor_trail 3

# Highlight active window
window_border_width 2pt
window_margin_width 2
draw_minimal_borders yes

map ctrl+shift+p>j kitten hints --customize-processing jira-hints.py

# Pick a link with fzf. Unlike the hints kitten this also finds OSC 8
# hyperlinks, whose URL never appears in the text (Claude Code's MR badge).
map ctrl+shift+e kitten links.py

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
