# Dim the dropdown when it loses focus, restore it when focused again.
# dynamic_background_opacity must be on for runtime opacity changes to work;
# the watcher (focus_opacity.py) does the actual dimming. Both are scoped to
# this dropdown instance only, so normal kitty windows are unaffected.
kitty_override dynamic_background_opacity=yes
kitty_override watcher=focus_opacity.py

# Lower the dropdown's macOS window level so higher-level popups (e.g. Paste's
# clipboard bar) render *above* it instead of being covered. The quick-access
# `layer` defaults to `overlay`, a very high NSWindow level that otherwise sits
# on top of Paste. NSFloatingWindowLevel (3) keeps the dropdown above normal
# app windows while letting popup/status-level windows show through. If Paste
# still ends up underneath, lower this further (e.g. NSNormalWindowLevel).
kitty_override macos_ns_window_layer=NSFloatingWindowLevel
