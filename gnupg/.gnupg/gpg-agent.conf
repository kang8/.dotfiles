# 10 hours
default-cache-ttl 36000
max-cache-ttl 36000

# default-cache-ttl-ssh 36000
# max-cache-ttl-ssh 36000

pinentry-program ~/.local/bin/pinentry-mac

# Bind the restricted ("extra") socket inside the shadow GNUPGHOME that Claude
# Code's sandbox uses (see init.sh). Binding it directly avoids a symlink there:
# a socket bind unlinks its path first, so a symlink would let a stray daemon
# started against the shadow home hijack the real ~/.gnupg socket.
# Restricted connections may sign but not EXPORT_KEY.
extra-socket ~/.gnupg-sandbox/S.gpg-agent
