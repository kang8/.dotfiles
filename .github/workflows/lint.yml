name: Lint

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Spell Check Repo
        uses: crate-ci/typos@v1.51.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.8 # Run with latest stable Deno.
      - run: deno fmt --check
