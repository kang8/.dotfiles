# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
right_format = """
${custom.git_master_status}\
${time}
"""

[character]
success_symbol = '\$'
error_symbol = '✗'
vimcmd_symbol = 'V'

[[battery.display]]
threshold = 20

[directory]
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[git_branch]
symbol = ''
truncation_symbol = ''

[time]
format = '[$time]($style) '
disabled = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
conflicted = "~${count} "
ahead = "⇡${count} "
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '
untracked = '[?${count}](white) '
stashed = "[*${count}](bright-black) "
modified = "!${count} "
staged = "[+${count}](green) "
renamed = '»${count} '
deleted = '[-${count}](red) '
style = 'yellow'

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
format = '[$symbol($version )]($style)'
symbol = " "

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = '☸ '
style = 'cyan bold'
detect_files = ['Chart.yaml', 'skaffold.yaml', 'kustomization.yaml', 'Tiltfile', 'devspace.yaml']
detect_folders = ['k8s', 'kubernetes', 'helm', 'kustomize', 'manifests']

[custom.git_master_status]
require_repo = true # only a gate; `when` is what triggers the module
when = true
command = '''
# remote default branch, e.g. origin/main
base=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null || echo 'origin/master')

current_branch=$(git symbolic-ref --short HEAD 2>/dev/null)
if [[ -n $current_branch && $current_branch != "${base#origin/}" ]]; then
  if git merge-base --is-ancestor HEAD "$base" 2>/dev/null; then
    echo "merged"
    exit 0
  fi
fi

ahead=$(git rev-list --count "$base"..HEAD 2>/dev/null || echo "0")
behind=$(git rev-list --count HEAD.."$base" 2>/dev/null || echo "0")

if [[ $ahead -gt 0 && $behind -gt 0 ]]; then
  echo "⇡$ahead⇣$behind"
elif [[ $ahead -gt 0 ]]; then
  echo "⇡$ahead"
elif [[ $behind -gt 0 ]]; then
  echo "⇣$behind"
else
  echo ""
fi
'''
format = '[$output]($style) '
style = 'red'

############
# Disabled #
############
[container]
disabled = true

[helm]
disabled = true

[lua]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true
